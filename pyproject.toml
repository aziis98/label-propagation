[project]
name = "label-propagation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Antonio De Lucreziis", email = "antonio.delucreziis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "notebook>=7.6.5",
    "numpy>=2.5.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
label-propagation = "label_propagation:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
